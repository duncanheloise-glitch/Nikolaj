<!DOCTYPE html>
<html>
<head>
  <title>Classified Transmission 💻❤️</title>

  <!-- Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      background: black;
      color: #00ff88;
      font-family: 'Share Tech Mono', monospace;
      text-align: center;
      overflow: hidden;
    }

    .container {
      margin-top: 15vh;
      padding: 20px;
    }

    .typewriter {
      font-size: 1.8em;
      white-space: pre-line;
      min-height: 120px;
    }

    button {
      font-size: 1.2em;
      padding: 10px 20px;
      margin: 15px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }

    .yes {
      background: #ff0080;
      color: white;
    }

    .no {
      position: absolute;
      background: white;
      color: #ff0080;
    }

    .big-valentine {
      font-size: 3.5em;
      background: linear-gradient(45deg, #ff0080, #ffcc00, #00ffff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: glow 1s infinite alternate;
    }

    @keyframes glow {
      from { text-shadow: 0 0 10px pink; }
      to { text-shadow: 0 0 30px red; }
    }

    .heart {
      position: absolute;
      color: pink;
      font-size: 20px;
      animation: float 6s linear infinite;
    }

    @keyframes float {
      from { transform: translateY(100vh); opacity: 1; }
      to { transform: translateY(-10vh); opacity: 0; }
    }
  </style>
</head>
<body>

<!-- Background Music -->
<audio id="bgMusic" loop>
  <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
</audio>

<!-- Sound Effects -->
<audio id="clickSound" src="https://www.soundjay.com/buttons/sounds/button-16.mp3"></audio>
<audio id="dramatic" src="https://www.soundjay.com/misc/sounds/dramatic-suspense-01.mp3"></audio>

<div class="container">
  <div id="text" class="typewriter"></div>
  <div id="buttons"></div>
</div>

<script>
const textElement = document.getElementById("text");
const buttonsElement = document.getElementById("buttons");
const bgMusic = document.getElementById("bgMusic");
const clickSound = document.getElementById("clickSound");
const dramatic = document.getElementById("dramatic");

let stage = 0;

const messages = [
  "How brave of you to click this link...",
  "You are now committing to something dangerous.",
  "Héloïse would like you to answer a question.",
  "Would you like to know?"
];

function typeText(text, callback) {
  textElement.innerHTML = "";
  let i = 0;
  const interval = setInterval(() => {
    textElement.innerHTML += text.charAt(i);
    i++;
    if (i >= text.length) {
      clearInterval(interval);
      if (callback) callback();
    }
  }, 40);
}

function nextStage() {
  if (stage < messages.length - 1) {
    typeText(messages[stage], () => {
      stage++;
      setTimeout(nextStage, 1200);
    });
  } else {
    typeText(messages[stage], () => {
      showFirstChoice();
    });
  }
}

function showFirstChoice() {
  buttonsElement.innerHTML = `
    <button class="yes" onclick="marryMe()">Yes</button>
    <button class="no" id="runaway1">No</button>
  `;
  makeRunaway("runaway1");
}

function marryMe() {
  clickSound.play();
  buttonsElement.innerHTML = "";
  typeText("Will you marry me?", () => {
    dramatic.play();
    setTimeout(() => {
      typeText("Oops. Wrong question.", () => {
        setTimeout(showValentineQuestion, 1500);
      });
    }, 1500);
  });
}

function showValentineQuestion() {
  textElement.innerHTML = "<div class='big-valentine'>Will you be my Valentine? 💖</div>";
  buttonsElement.innerHTML = `
    <button class="yes" onclick="finalYes()">YES 💘</button>
    <button class="no" id="runaway2">No</button>
  `;
  createHearts();
  makeRunaway("runaway2");
}

function finalYes() {
  clickSound.play();
  confetti({ particleCount: 200, spread: 120 });
  buttonsElement.innerHTML = "";
  setTimeout(() => {
    typeText("Too bad. She's 4377km away. 🌍", () => {
      setTimeout(() => {
        typeText("See you in 10 weeks. ❤️");
      }, 1500);
    });
  }, 1500);
}

function makeRunaway(id) {
  const btn = document.getElementById(id);
  btn.addEventListener("mouseover", () => {
    const x = Math.random() * (window.innerWidth - 100);
    const y = Math.random() * (window.innerHeight - 50);
    btn.style.left = x + "px";
    btn.style.top = y + "px";
  });
}

function createHearts() {
  setInterval(() => {
    const heart = document.createElement("div");
    heart.classList.add("heart");
    heart.innerHTML = "💖";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.fontSize = Math.random() * 20 + 15 + "px";
    document.body.appendChild(heart);
    setTimeout(() => heart.remove(), 6000);
  }, 300);
}

document.body.addEventListener("click", () => {
  bgMusic.play().catch(()=>{});
}, { once: true });

nextStage();
</script>

</body>
</html>
