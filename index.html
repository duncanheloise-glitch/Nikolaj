DOCTYPE html>
<html>
<head>
  <title>Dangerous Link 💀❤️</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    body {
      text-align: center;
      font-family: Arial, sans-serif;
      background: linear-gradient(to bottom right, #ffd6e0, #ffc2d1);
      overflow: hidden;
      margin: 0;
      padding: 0;
    }

    .container {
      margin-top: 120px;
      padding: 20px;
    }

    h1 {
      font-size: 2.5em;
      color: #ff2e63;
      margin-bottom: 40px;
    }

    button {
      font-size: 1.2em;
      padding: 10px 20px;
      margin: 15px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      position: relative;
    }

    .yes {
      background-color: #ff2e63;
      color: white;
    }

    .no {
      background-color: white;
      color: #ff2e63;
      position: absolute;
    }
  </style>
</head>
<body>

<div class="container" id="content">
</div>

<script>

let stage = 0;

function nextStage() {
  const content = document.getElementById("content");

  if (stage === 0) {
    content.innerHTML = "<h1>How brave of you to click this link.</h1>";
  }
  else if (stage === 1) {
    content.innerHTML = "<h1>You are now committing to something dangerous.</h1>";
  }
  else if (stage === 2) {
    content.innerHTML = "<h1>Héloïse would like you to answer a question.</h1>";
  }
  else if (stage === 3) {
    content.innerHTML = `
      <h1>Would you like to know?</h1>
      <button class="yes" onclick="marryMe()">Yes</button>
      <button class="no" id="runaway1">No</button>
    `;
    makeButtonRun("runaway1");
  }

  stage++;
}

function marryMe() {
  const content = document.getElementById("content");
  content.innerHTML = "<h1>Will you marry me?</h1>";

  setTimeout(() => {
    content.innerHTML = "<h1>Oops. Wrong question.</h1>";
  }, 1500);

  setTimeout(() => {
    content.innerHTML = `
      <h1>Will you be my Valentines? 💘</h1>
      <button class="yes" onclick="finalYes()">Yes 💖</button>
      <button class="no" id="runaway2">No</button>
    `;
    makeButtonRun("runaway2");
  }, 3000);
}

function finalYes() {
  confetti({
    particleCount: 200,
    spread: 120,
    origin: { y: 0.6 }
  });

  const content = document.getElementById("content");

  setTimeout(() => {
    content.innerHTML = "<h1>Too bad. She's 4377km away. 🌍</h1>";
  }, 1500);

  setTimeout(() => {
    content.innerHTML = "<h1>See you in 10 weeks. ❤️</h1>";
  }, 3500);
}

function makeButtonRun(id) {
  const button = document.getElementById(id);

  button.addEventListener("mouseover", function() {
    const x = Math.random() * (window.innerWidth - 100);
    const y = Math.random() * (window.innerHeight - 50);
    button.style.left = x + "px";
    button.style.top = y + "px";
  });
}

document.body.addEventListener("click", function() {
  if (stage < 4) {
    nextStage();
  }
});

nextStage();

</script>

</body>
